[project]
name = "simple-fsm"
# Versioning follow CalVer (YYYY.MM.DD) for PEP 440 compliance
version = "2026.09.01"
description = "A simple-to-use Python finite state machine library"
readme = "README.md"
authors = [
    { name = "Binit Shah", email = "bshah@hello-robot.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/hello-binit/simple_fsm"
